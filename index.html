<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mayotti</title>
    <meta name="description" content="Mayotti is an AI-powered expense tracker. Log spending by text, voice, or receipt photo and get insights that help you save." />
    <meta name="author" content="Mayotti" />

    <meta property="og:title" content="Mayotti" />
    <meta property="og:description" content="Mayotti is an AI-powered expense tracker. Log spending by text, voice, or receipt photo and get insights that help you save." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#F4F5F1" />
  </head>

  <body>
    <!-- Inline splash to prevent flash before React loads -->
    <div id="initial-splash" style="position: fixed; inset: 0; z-index: 9999; background: #F4F5F1; display: flex; align-items: center; justify-content: center;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 16px;">
        <svg width="88" height="88" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="16" fill="#E5F0E9"/>
          <path d="M32 30V18" stroke="#1F6B4F" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M32 22c-8 0-13-4-13-11 8 0 13 4 13 11z" fill="#1F6B4F"/>
          <path d="M32 19c0-6 4-10 12-10 0 7-4 10-12 10z" fill="#1F6B4F" fill-opacity="0.7"/>
          <circle cx="32" cy="42" r="13" fill="#1F6B4F"/>
          <circle cx="32" cy="42" r="8.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2"/>
        </svg>
        <div style="font: 800 34px Manrope, system-ui, -apple-system, sans-serif; letter-spacing: -0.03em; color: #1F6B4F;">mayotti</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide initial splash once React app loads
      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          var splash = document.getElementById('initial-splash');
          if (splash) splash.style.display = 'none';
        }, 100);
      });
    </script>
  </body>
</html>
